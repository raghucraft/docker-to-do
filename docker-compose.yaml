services:

  frontend:
    build: ./frontend
    container_name: todo-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: todo-backend

    ports:
      - "3000:3000"

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: todo-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data: